name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # lets a push for one package be retried without moving/recreating a tag

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for nuget.org Trusted Publishing's OIDC token exchange

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Gate the release on the theme-integrity suite. A broken theme, an asymmetric
      # Light/Dark dictionary, or a control that no longer templates must not reach NuGet.
      - name: Test
        run: dotnet test Kuwantima.Tests/Kuwantima.Tests.csproj -c Release

      - name: Test Kuwantima.DataGrid
        run: dotnet test Kuwantima.DataGrid.Tests/Kuwantima.DataGrid.Tests.csproj -c Release

      - name: Build
        run: dotnet build Kuwantima/Kuwantima.csproj -c Release

      - name: Build Kuwantima.DataGrid
        run: dotnet build Kuwantima.DataGrid/Kuwantima.DataGrid.csproj -c Release

      - name: Pack
        run: dotnet pack Kuwantima/Kuwantima.csproj -c Release --no-build

      - name: Pack Kuwantima.DataGrid
        run: dotnet pack Kuwantima.DataGrid/Kuwantima.DataGrid.csproj -c Release --no-build

      # Trusted Publishing: exchange this run's short-lived GitHub OIDC token for a temporary
      # (1-hour) nuget.org API key, scoped by the "Kuwantima GitHub Actions" policy. Replaces the
      # long-lived NUGET_API_KEY secret, which that policy's glob (Kuwantima, Kuwantima.DataGrid)
      # has superseded. `user` must be the nuget.org profile username, not an email address.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Both packages are versioned in lockstep (see CLAUDE.md's Version Management section) and
      # publish from the same tag push, whether or not both changed content this release. Two
      # independent steps rather than one — pushing an already-published version is a real,
      # expected failure mode on a workflow_dispatch retry (e.g. one package's push succeeded
      # already, only the other needs retrying), and it must not block the package that still
      # needs to go out.
      - name: Publish Kuwantima to NuGet
        id: publish-kuwantima
        run: dotnet nuget push Kuwantima/bin/Release/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      - name: Publish Kuwantima.DataGrid to NuGet
        if: always() && steps.nuget-login.outcome == 'success'
        run: dotnet nuget push Kuwantima.DataGrid/bin/Release/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
