name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Gate the release on the theme-integrity suite. A broken theme, an asymmetric
      # Light/Dark dictionary, or a control that no longer templates must not reach NuGet.
      - name: Test
        run: dotnet test Kuwantima.Tests/Kuwantima.Tests.csproj -c Release

      - name: Test Kuwantima.DataGrid
        run: dotnet test Kuwantima.DataGrid.Tests/Kuwantima.DataGrid.Tests.csproj -c Release

      - name: Build
        run: dotnet build Kuwantima/Kuwantima.csproj -c Release

      - name: Build Kuwantima.DataGrid
        run: dotnet build Kuwantima.DataGrid/Kuwantima.DataGrid.csproj -c Release

      - name: Pack
        run: dotnet pack Kuwantima/Kuwantima.csproj -c Release --no-build

      - name: Pack Kuwantima.DataGrid
        run: dotnet pack Kuwantima.DataGrid/Kuwantima.DataGrid.csproj -c Release --no-build

      # Both packages are versioned in lockstep (see CLAUDE.md's Version Management section) and
      # publish from the same tag push, whether or not both changed content this release.
      - name: Publish to NuGet
        run: |
          dotnet nuget push Kuwantima/bin/Release/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}
          dotnet nuget push Kuwantima.DataGrid/bin/Release/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}
