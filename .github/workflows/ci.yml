name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Avalonia.Headless needs no display server, so this runs on plain ubuntu
      # with no xvfb wrapper.
      - name: Test
        run: dotnet test Kuwantima.Tests/Kuwantima.Tests.csproj
